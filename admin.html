<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Puzzle Admin</title>
<style>body{margin:0;background:#20201e;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:800px;margin:30px auto;padding:16px}.card{background:#302e2b;padding:22px;border-radius:14px}label{display:block;margin:14px 0 6px;color:#bbb;font-weight:700;font-size:13px}input,textarea,select{width:100%;box-sizing:border-box;background:#242321;color:#fff;border:1px solid #555;border-radius:8px;padding:11px;font:inherit}textarea{min-height:90px;font-family:monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:18px;border:0;border-radius:8px;padding:12px 18px;background:#81b64c;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:15px;padding:12px;border-radius:8px;background:#3b3936}.ok{background:#315b27}.err{background:#63302f}@media(max-width:650px){.row{grid-template-columns:1fr}}</style>
<div class=wrap><div class=card><h1>♞ Puzzle Admin</h1><p>Publish a new puzzle. The public link stays the same.</p><label>Admin key</label><input id=key type=password><label>Title</label><input id=title value="My Chess Puzzle"><div class=row><div><label>Starting FEN</label><input id=fen value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></div><div><label>Player</label><select id=color><option value=w>White</option><option value=b>Black</option></select></div></div><label>Accepted moves (UCI, comma separated)</label><textarea id=moves>e2e4, e7e5, g1f3</textarea><label>Final target FEN (optional)</label><input id=target><button onclick=publish()>Publish new puzzle</button><div id=msg class=msg>Not published yet.</div></div></div>
<script>
async function publish(){let m=document.querySelector("#msg");m.className="msg";m.textContent="Publishing…";let body={title:title.value,fen:fen.value,playerColor:color.value,acceptedMoves:moves.value.split(",").map(x=>x.trim()).filter(Boolean),targetFen:target.value};try{let r=await fetch("/.netlify/functions/publish",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key.value},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||"Publish failed");m.className="msg ok";m.textContent="Published version #"+d.version+". The public puzzle is updated."}catch(e){m.className="msg err";m.textContent=e.message}}
</script>
