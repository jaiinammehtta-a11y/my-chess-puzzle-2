<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Admin</title><style>
body{margin:0;background:#20201e;color:#eee;font-family:system-ui,sans-serif}.wrap{width:min(850px,100%);margin:30px auto;padding:0 16px}.card{background:#302e2b;padding:22px;border-radius:14px}label{display:block;margin:14px 0 6px;color:#bbb;font-weight:700;font-size:13px}input,textarea,select{width:100%;background:#242321;color:#fff;border:1px solid #555;border-radius:8px;padding:11px;font:inherit}textarea{min-height:90px;font-family:monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:18px;border:0;border-radius:8px;padding:12px 18px;background:#81b64c;color:white;font-weight:800;cursor:pointer}.msg{margin-top:15px;padding:12px;border-radius:8px;background:#3b3936}.ok{background:#315b27}.err{background:#63312f}.help{color:#aaa;font-size:13px;line-height:1.5}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><h1>♞ Puzzle Admin</h1><p class="help">Publish a new puzzle. Your public URL stays the same.</p><label>Admin key</label><input id="key" type="password"><label>Title</label><input id="title" value="My Chess Puzzle"><div class="row"><div><label>Starting FEN</label><input id="fen" value="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></div><div><label>Player</label><select id="color"><option value="w">White</option><option value="b">Black</option></select></div></div><label>Accepted moves (UCI, comma separated)</label><textarea id="moves">e2e4, e7e5, g1f3</textarea><label>Final target FEN (optional)</label><input id="target"><p class="help">Example: e2e4, e7e5, g1f3. Legal chess moves are enforced; only your accepted sequence is considered correct.</p><button id="pub">Publish new puzzle</button><div id="msg" class="msg">Not published yet.</div></div></div><script>
pub.onclick=async()=>{let b={title:title.value,fen:fen.value,playerColor:color.value,acceptedMoves:moves.value.split(",").map(x=>x.trim()).filter(Boolean),targetFen:target.value},m=document.querySelector("#msg");m.className="msg";m.textContent="Publishing…";try{let r=await fetch("/api/publish",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key.value},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||"Publish failed");m.className="msg ok";m.textContent="Published version #"+d.version+". The public puzzle is now updated."}catch(e){m.className="msg err";m.textContent=e.message}}
</script></body></html>
