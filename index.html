<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chess Puzzle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#312e2b;color:#eee;font-family:system-ui,sans-serif}.top{height:62px;background:#262522;padding:0 20px;display:flex;align-items:center;font-weight:800;font-size:20px}.wrap{width:min(1160px,100%);margin:24px auto;padding:0 14px}.grid{display:grid;grid-template-columns:minmax(300px,760px) 330px;gap:20px}.card{background:#262522;padding:12px;border-radius:12px;box-shadow:0 12px 35px #0005}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;overflow:hidden}.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}.light{background:#f0d9b5}.dark{background:#b58863}.sq.sel{box-shadow:inset 0 0 0 5px #fff8}.sq.last{background:#c9a94b!important}.sq.legal:after{content:"";width:22%;height:22%;border-radius:50%;background:#0004;position:absolute}.sq.capture:after{content:"";position:absolute;inset:5%;border:5px solid #0004;border-radius:50%}.piece{font-family:serif;font-size:clamp(34px,8vw,74px);line-height:1;z-index:2}.wp{color:white;text-shadow:0 2px #555,0 0 1px #222}.bp{color:#171717;text-shadow:0 1px #fff7}.coord{position:absolute;font-size:11px;font-weight:800;opacity:.75}.rank{top:3px;left:4px}.file{right:4px;bottom:2px}.light .coord{color:#704626}.dark .coord{color:#f7dfbf}.panel{background:#262522;border-radius:12px;overflow:hidden}.head{padding:18px}.title{font-size:21px;font-weight:800}.sub{color:#aaa;font-size:13px;margin-top:4px}.status{margin:0 14px 12px;padding:13px;border-radius:8px;background:#3b3936;font-weight:750}.good{background:#315b27}.bad{background:#67312f}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}button{border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}.green{background:#81b64c;color:#fff}.gray{background:#45423f;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #45423f;border-bottom:1px solid #45423f}.stat{padding:12px 14px}.stat+ .stat{border-left:1px solid #45423f}.lbl{font-size:10px;color:#aaa;text-transform:uppercase}.val{font-weight:800}.moves{padding:14px}.moves h3{font-size:12px;color:#aaa;text-transform:uppercase}.list{background:#302e2b;border-radius:8px;padding:8px;font:13px monospace}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{max-width:760px;width:100%;margin:auto}}
</style></head><body><div class="top">♞ Live Puzzle</div><div class="wrap"><div class="grid"><section class="card"><div id="board" class="board"></div></section><aside class="panel"><div class="head"><div id="title" class="title">Loading…</div><div id="sub" class="sub"></div></div><div id="status" class="status">Loading…</div><div class="btns"><button id="retry" class="green">↻ Retry</button><button id="share" class="gray">Share link</button></div><div class="stats"><div class="stat"><div class="lbl">Puzzle</div><div id="ver" class="val">—</div></div><div class="stat"><div class="lbl">Progress</div><div id="prog" class="val">0 / 0</div></div></div><div class="moves"><h3>Moves</h3><div id="moves" class="list">No moves yet.</div></div></aside></div></div>
<script>
const G={wp:"♙",wn:"♘",wb:"♗",wr:"♖",wq:"♕",wk:"♔",bp:"♟",bn:"♞",bb:"♝",br:"♜",bq:"♛",bk:"♚"};let P,g,i=0,sel=null,t=[],last=null,bad=false,done=false;const B=document.querySelector("#board");
function sq(f,r){return"abcdefgh"[f]+(8-r)}function st(x,c=""){let e=document.querySelector("#status");e.textContent=x;e.className="status "+c}
function draw(){B.innerHTML="";let b=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){let s=sq(f,r),e=document.createElement("div");e.className="sq "+((f+r)%2?"dark":"light");if(sel===s)e.classList.add("sel");if(last&&(last.from===s||last.to===s))e.classList.add("last");if(t.includes(s))e.classList.add(g.get(s)?"capture":"legal");let p=b[r][f];if(p){let q=document.createElement("span");q.className="piece "+(p.color==="w"?"wp":"bp");q.textContent=G[p.color+p.type];e.appendChild(q)}if(f===7){let q=document.createElement("span");q.className="coord rank";q.textContent=8-r;e.appendChild(q)}if(r===7){let q=document.createElement("span");q.className="coord file";q.textContent="abcdefgh"[f];e.appendChild(q)}e.onclick=()=>click(s);B.appendChild(e)}}
function click(s){if(bad||done||g.turn()!==P.playerColor)return;let p=g.get(s);if(!sel){if(p&&p.color===P.playerColor){sel=s;t=g.moves({square:s});draw()}return}if(s===sel){sel=null;t=[];draw();return}if(!t.includes(s)){sel=null;t=[];st("Illegal move — not allowed.","bad");draw();return}let u=sel+s;if(u!==P.acceptedMoves[i]){bad=true;sel=null;t=[];st("Wrong move. Press Retry to try again.","bad");draw();return}let m=g.move({from:sel,to:s,promotion:"q"});if(!m)return;last=m;sel=null;t=[];i++;upd();draw();if(i>=P.acceptedMoves.length){finish();return}st("Correct! Opponent reply…");setTimeout(reply,350)}
function reply(){let u=P.acceptedMoves[i],m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m){bad=true;st("Puzzle data has an illegal reply.","bad");return}last=m;i++;upd();draw();if(i>=P.acceptedMoves.length)finish();else st("Your turn. Find the correct move.")}
function finish(){done=true;st("Puzzle solved!","good");document.querySelector("#ver").textContent="Solved"}
function upd(){document.querySelector("#prog").textContent=Math.ceil(i/2)+" / "+Math.ceil(P.acceptedMoves.length/2);document.querySelector("#ver").textContent="#"+P.version;let h=g.history();document.querySelector("#moves").textContent=h.length?h.map((x,n)=>(n%2===0?(n/2+1)+". ":"")+x).join(" "):"No moves yet"}
function reset(){g=new Chess(P.fen);i=0;sel=null;t=[];last=null;bad=false;done=false;st("Your turn. Find the correct move.");upd();draw()}
async function load(){try{let r=await fetch("/api/puzzle",{cache:"no-store"});P=await r.json();document.querySelector("#title").textContent=P.title;document.querySelector("#sub").textContent=(P.playerColor==="w"?"White":"Black")+" to move · Live puzzle";reset()}catch(e){st("Could not load puzzle.","bad")}}
document.querySelector("#retry").onclick=reset;document.querySelector("#share").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);st("Puzzle link copied!")}catch(e){st("Copy the page URL and send it.","bad")}};load();
</script></body></html>
