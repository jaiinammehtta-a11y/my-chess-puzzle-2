<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Live Chess Puzzle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#312e2b;color:#eee;font-family:system-ui,sans-serif}.top{height:60px;background:#262522;padding:18px 24px;font-weight:800}.wrap{max-width:1100px;margin:24px auto;padding:0 14px;display:grid;grid-template-columns:minmax(300px,700px) 320px;gap:18px}.card,.panel{background:#262522;border-radius:12px}.card{padding:10px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}.sq{position:relative;display:flex;align-items:center;justify-content:center}.l{background:#f0d9b5}.d{background:#b58863}.piece{font-size:clamp(34px,8vw,72px);z-index:2}.w{color:#fff;text-shadow:0 2px #555}.b{color:#171717;text-shadow:0 1px #fff}.sel{box-shadow:inset 0 0 0 5px #fff8}.last{background:#c9a94b!important}.legal:after{content:"";width:20%;height:20%;border-radius:50%;background:#0005;position:absolute}.capture:after{content:"";position:absolute;inset:5%;border:5px solid #0005;border-radius:50%}.panel{padding:18px}.title{font-size:21px;font-weight:800}.sub{color:#aaa;margin:5px 0 15px}.status{padding:12px;border-radius:8px;background:#3b3936;margin-bottom:10px;font-weight:700}.bad{background:#63302f}.good{background:#315b27}button{border:0;border-radius:8px;padding:11px 15px;background:#81b64c;color:#fff;font-weight:800;cursor:pointer;margin-right:6px}.gray{background:#45423f}.moves{margin-top:18px;background:#302e2b;padding:10px;border-radius:8px;font:13px monospace}@media(max-width:850px){.wrap{grid-template-columns:1fr}}
</style>
<div class=top>♞ Live Puzzle</div><main class=wrap><div class=card><div id=board class=board></div></div><div class=panel><div id=title class=title>Loading…</div><div id=sub class=sub></div><div id=status class=status>Loading…</div><button onclick=reset()>↻ Retry</button><button class=gray onclick=share()>Share link</button><div class=moves id=moves>No moves yet.</div></div></main>
<script>
const icons={wp:"♙",wn:"♘",wb:"♗",wr:"♖",wq:"♕",wk:"♔",bp:"♟",bn:"♞",bb:"♝",br:"♜",bq:"♛",bk:"♚"};let P,g,i=0,sel=null,targets=[],last=null,failed=false,done=false;
const B=document.querySelector("#board"),S=document.querySelector("#status");
function setS(x,c=""){S.textContent=x;S.className="status "+c}function name(f,r){return"abcdefgh"[f]+(8-r)}
function draw(){B.innerHTML="";let a=g.board();for(let r=0;r<8;r++)for(let f=0;f<8;f++){let s=name(f,r),e=document.createElement("div");e.className="sq "+((r+f)%2?"d":"l");if(s===sel)e.classList.add("sel");if(last&&(last.from===s||last.to===s))e.classList.add("last");if(targets.includes(s))e.classList.add(g.get(s)?"capture":"legal");let p=a[r][f];if(p){let q=document.createElement("span");q.className="piece "+p.color;q.textContent=icons[p.color+p.type];e.appendChild(q)}e.onclick=()=>click(s);B.appendChild(e)}}
function click(s){if(failed||done||g.turn()!==P.playerColor)return;let p=g.get(s);if(!sel){if(p&&p.color===P.playerColor){sel=s;targets=g.moves({square:s});draw()}return}if(!targets.includes(s)){sel=null;targets=[];setS("Illegal move — not allowed.","bad");draw();return}let u=sel+s;if(u!==P.acceptedMoves[i]){failed=true;setS("Wrong move. Press Retry to try again.","bad");sel=null;targets=[];draw();return}let m=g.move({from:sel,to:s,promotion:"q"});last=m;sel=null;targets=[];i++;draw();if(i>=P.acceptedMoves.length)return finish();setS("Correct! Opponent reply…");setTimeout(reply,300)}
function reply(){let u=P.acceptedMoves[i],m=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m)return setS("Puzzle data contains an illegal reply.","bad");last=m;i++;draw();if(i>=P.acceptedMoves.length)finish();else setS("Your turn. Find the correct move.")}
function finish(){done=true;setS("Puzzle solved!","good")}
function reset(){g=new Chess(P.fen);i=0;sel=null;targets=[];last=null;failed=false;done=false;setS("Your turn. Find the correct move.");draw();document.querySelector("#moves").textContent="No moves yet."}
async function load(){try{let r=await fetch("/.netlify/functions/puzzle",{cache:"no-store"});P=await r.json();document.querySelector("#title").textContent=P.title;document.querySelector("#sub").textContent=(P.playerColor==="w"?"White":"Black")+" to move";reset()}catch(e){setS("Could not load puzzle.","bad")}}
function share(){navigator.clipboard?.writeText(location.href);setS("Puzzle link copied!")}load();
</script>
